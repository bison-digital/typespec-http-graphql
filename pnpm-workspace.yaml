minimumReleaseAgeExclude:
  - "@typespec/asset-emitter@0.79.3"
  - "@typespec/compiler@1.17.0"
  - "@typespec/events@0.87.0"
  - "@typespec/http-specs@0.1.0-alpha.44"
  - "@typespec/http@1.17.0"
  - "@typespec/openapi3@1.17.0"
  - "@typespec/openapi@1.17.0"
  - "@typespec/rest@0.87.0"
  - "@typespec/spector@0.1.0-alpha.30"
  - "@typespec/sse@0.87.0"
  - "@typespec/streams@0.87.0"
  - "@typespec/versioning@0.87.0"
  - "@typespec/xml@0.87.0"
  - "@hono/node-server@2.1.5"
  - "typespec-http-zod@0.33.0"
  - "typespec-hono@0.30.0"
  - "typespec-http-zod@0.34.0"
  - "typespec-hono@0.31.0"

# `wrangler` bundles with esbuild and serves with workerd, and both need their install scripts to
# run. Named one at a time rather than allowed as a class: pnpm blocks build scripts by default, and
# the two that run here should be two somebody chose.
#
# **The key is `allowBuilds`, not `onlyBuiltDependencies`.** pnpm 11 renamed it, and the old key is
# accepted in the file and silently does nothing -- `pnpm install` keeps exiting 1 with
# ERR_PNPM_IGNORED_BUILDS while the config looks right. The same trap as `pnpm.overrides` in
# `package.json`, which pnpm 11 also reads no longer, and only warns about.
allowBuilds:
  esbuild: true
  workerd: true

patchedDependencies:
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch
