name: Release

# **Publishing is deliberate and cannot happen by accident.** This runs only when a `v*` tag is
# pushed, or when somebody dispatches it by hand. A merge to `main` publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `write`, not `read`: the last step creates the GitHub release.
      contents: write
      # Required for npm provenance: npm exchanges this for a signed attestation linking the
      # published tarball to the commit and workflow that produced it.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # **`--frozen-lockfile` exits 0 on a dangling link**, so a release checkout with a sibling
      # redirected to a local path would install and fail four steps later as a wall of TS2307.
      - name: Refuse to publish against a locally-linked dependency
        run: |
          if grep -qE '^\s+typespec-[a-z-]+:\s*"?(link|file):' pnpm-workspace.yaml; then
            echo "::error::pnpm-workspace.yaml overrides a first-party package to a local path."
            echo "::error::Remove the override and re-run 'pnpm install' so the lockfile resolves it"
            echo "::error::from the registry, then re-tag."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # The install above can succeed while a dependency is not actually present, so say so here
      # rather than letting `tsc` be the one to notice. The emitter loads the library; the generated
      # runtime imports `graphql`, which a consumer owns as a peer.
      - name: Verify the dependencies resolved
        run: |
          node --input-type=module -e "await import('typespec-http-zod')"
          node --input-type=module -e "await import('graphql')"

      - run: pnpm build

      # The full gate again, against the exact commit being published: CI passing on the branch is
      # not the same claim, since a tag can point anywhere.
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      # `--provenance` is redundant with publishConfig and stated anyway, because the flag is what a
      # reader looks for.
      - run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # **A tag is not a release.** The notes ARE the changelog section, extracted rather than
      # rewritten, so there is one account of the release.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [$version]" 'index($0,v)==1{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md > /tmp/notes.md
          # A version with no changelog section is a release nobody can read: fail rather than
          # publish empty notes.
          test -s /tmp/notes.md
          # Idempotent, because a publish that failed on auth is rerun against a tag that already exists.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
